apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.antts.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.antts.app"
        minSdk 26
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions "target"
    productFlavors {
        phone {
            dimension "target"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    phoneImplementation project(':utils')
}
