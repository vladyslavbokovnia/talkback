apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.antts.app"
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // TalkBack's accessibility-tree utilities: node text, visibility, roles,
    // traversal order. Used by the text extractor.
    implementation project(':utils')
}
