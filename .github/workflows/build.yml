name: Build APK

on:
  push:
    branches: [antts-text-extraction]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses and install platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      # The repository has no Gradle wrapper; AGP 8.11 needs Gradle 8.13+.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build AnTTS debug APK (phone flavor)
        run: gradle :antts:assemblePhoneDebug --stacktrace

      - name: Report APK size
        if: always()
        run: find . -name '*.apk' -exec ls -l {} \;

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: antts-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: warn
